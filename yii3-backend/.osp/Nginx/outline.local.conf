index index.php;
client_max_body_size 250m;

# Yii front controller fallback without replacing OSPanel's generated PHP handler.
if (!-e $request_filename) {
    rewrite ^ /index.php last;
}

location ~* ^/(?:config|runtime|src|tests|vendor)(?:/|$) {
    deny all;
}

location ~* /(?:\.env|composer\.(?:json|lock)|codeception\.yml|phpunit\.xml|psalm\.xml)$ {
    deny all;
}

location ~ /\. {
    deny all;
}
