[outline.local]

project_enabled = on
primary_domain = on
project_category = PHP
project_root = {base_dir}\yii3-backend
web_root = {base_dir}\yii3-backend\public
base_url = https://{host_decoded}

http_engine = Nginx
php_engine = PHP-8.5
environment = MariaDB-11.8 Redis Mailpit Node-24.16.0 System

bind_ip = 127.0.0.1
server_aliases = www.{host}
http_port = 80
https_port = 443
tls_enabled = on
http2_enabled = on
terminal_codepage = 65001
